<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Flowers For You 🌹</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, sans-serif;
}


/* =========================================
   HALAMAN AWAL
========================================= */

#page1 {
    width: 100%;
    height: 100vh;

    background: #fa6f89;

    display: flex;
    justify-content: center;
    align-items: center;

    transition:
        opacity 1s ease,
        transform 1s ease;
}

.card {
    width: min(90%, 420px);

    text-align: center;

    display: flex;
    flex-direction: column;
    align-items: center;
}


/* =========================================
   FOTO
========================================= */

.bear {
    width: 180px;
    height: 180px;

    object-fit: cover;

    border-radius: 10px;

    margin-bottom: 15px;

    display: block;

    box-shadow:
        0 5px 20px rgba(0, 0, 0, 0.2);
}


/* =========================================
   PERTANYAAN
========================================= */

.question {
    font-size: 20px;
    font-weight: bold;

    color: #111;

    margin-bottom: 15px;
}


/* =========================================
   TOMBOL
========================================= */

.buttons {
    display: flex;

    justify-content: center;
    align-items: center;

    gap: 12px;

    position: relative;

    min-height: 45px;

    width: 230px;
}

button {
    border: none;

    padding: 8px 18px;

    font-size: 13px;

    font-weight: bold;

    cursor: pointer;

    border-radius: 5px;

    transition: transform 0.2s;
}

button:hover {
    transform: scale(1.08);
}


/* YES */

#yes {
    background: #00b62e;
    color: white;
}


/* NO */

#no {
    background: #ff1c1c;
    color: white;

    position: relative;
}


/* =========================================
   HALAMAN BUNGA
========================================= */

#page2 {
    position: fixed;

    inset: 0;

    background:
        radial-gradient(
            circle at center,
            #111b2d 0%,
            #07101c 50%,
            #02050a 100%
        );

    display: flex;

    justify-content: center;
    align-items: center;

    opacity: 0;

    pointer-events: none;

    transition: opacity 1.5s ease;

    overflow: hidden;
}


/* =========================================
   DOME
========================================= */

.dome {
    position: relative;

    width: 230px;
    height: 310px;

    display: flex;

    justify-content: center;

    align-items: flex-end;

    margin-top: -70px;
}


/* =========================================
   KACA
========================================= */

.glass {
    position: absolute;

    bottom: 25px;

    width: 210px;
    height: 275px;

    border-radius:
        110px 110px 15px 15px;

    border: 2px solid
        rgba(190, 220, 255, 0.75);

    background:
        linear-gradient(
            100deg,
            rgba(255,255,255,.12),
            rgba(255,255,255,.02),
            rgba(255,255,255,.10)
        );

    box-shadow:

        inset 10px 0 20px
        rgba(255,255,255,.08),

        inset -10px 0 20px
        rgba(100,180,255,.08),

        0 0 15px
        rgba(120,180,255,.25);

    overflow: hidden;

    z-index: 5;
}


/* =========================================
   REFLEKSI KACA
========================================= */

.glass::before {
    content: "";

    position: absolute;

    left: 30px;
    top: 25px;

    width: 7px;
    height: 180px;

    border-radius: 10px;

    background:
        linear-gradient(
            transparent,
            rgba(255,255,255,.55),
            transparent
        );

    opacity: .55;
}


/* =========================================
   DASAR DOME
========================================= */

.base {
    position: absolute;

    bottom: 15px;

    width: 220px;
    height: 15px;

    border-radius: 5px;

    background:
        linear-gradient(
            #bfc9d4,
            #687586
        );

    box-shadow:
        0 0 8px rgba(150,200,255,.3);

    z-index: 8;
}


/* =========================================
   ROSE
========================================= */

.rose {
    position: absolute;

    bottom: 80px;

    left: 50%;

    transform:
        translateX(-50%);

    width: 100px;
    height: 150px;

    z-index: 3;

    animation:
        sway 3s ease-in-out infinite;
}


/* =========================================
   BATANG
========================================= */

.stem {
    position: absolute;

    width: 5px;
    height: 105px;

    background:
        linear-gradient(
            90deg,
            #1b7a2b,
            #3ccf4a,
            #145b22
        );

    left: 48px;
    top: 43px;

    transform: rotate(4deg);

    border-radius: 5px;

    transform-origin: bottom;
}


/* =========================================
   DAUN
========================================= */

.leaf {
    position: absolute;

    width: 35px;
    height: 18px;

    background:
        linear-gradient(
            135deg,
            #43d34d,
            #0c6420
        );

    border-radius:
        100% 0 100% 0;
}

.leaf.left {
    left: 17px;
    top: 85px;

    transform: rotate(25deg);
}

.leaf.right {
    left: 48px;
    top: 110px;

    transform: rotate(-30deg);
}


/* =========================================
   BUNGA
========================================= */

.flower {
    position: absolute;

    left: 50%;
    top: 10px;

    width: 70px;
    height: 65px;

    transform:
        translateX(-50%);

    filter:
        drop-shadow(
            0 0 12px #ff3b6b
        );
}


/* =========================================
   PETAL
========================================= */

.petal {
    position: absolute;

    background:
        radial-gradient(
            circle at 30% 30%,
            #ff6b91,
            #e9164c 55%,
            #8e092e
        );

    border-radius:
        50% 50% 45% 45%;
}

.petal.p1 {
    width: 40px;
    height: 35px;

    left: 15px;
    top: 18px;
}

.petal.p2 {
    width: 40px;
    height: 35px;

    left: 0;
    top: 12px;

    transform:
        rotate(-30deg);
}

.petal.p3 {
    width: 40px;
    height: 35px;

    right: 0;
    top: 12px;

    transform:
        rotate(30deg);
}

.petal.p4 {
    width: 42px;
    height: 38px;

    left: 14px;
    top: 0;
}

.petal.p5 {
    width: 32px;
    height: 30px;

    left: 20px;
    top: 20px;

    background:
        radial-gradient(
            circle,
            #ff91a9,
            #c50d3d
        );
}


/* =========================================
   BUNGA BERGOYANG
========================================= */

@keyframes sway {

    0% {
        transform:
            translateX(-50%)
            rotate(-2deg);
    }

    50% {
        transform:
            translateX(-50%)
            rotate(2deg);
    }

    100% {
        transform:
            translateX(-50%)
            rotate(-2deg);
    }
}


/* =========================================
   SPARKLE
========================================= */

.sparkles {
    position: absolute;

    inset: 0;

    z-index: 2;
}

.sparkle {
    position: absolute;

    width: 3px;
    height: 3px;

    background: white;

    border-radius: 50%;

    box-shadow:
        0 0 6px white,
        0 0 12px #ff7192;

    animation:
        sparkle 2s ease-in-out infinite;
}

@keyframes sparkle {

    0% {
        opacity: 0;
        transform: scale(.3);
    }

    50% {
        opacity: 1;
        transform: scale(1.5);
    }

    100% {
        opacity: 0;
        transform: scale(.3);
    }
}


/* =========================================
   ❤️ TULISAN I LOVE YOU
========================================= */

.love-message {
    position: absolute;

    left: 50%;

    bottom: 7%;

    transform:
        translateX(-50%)
        translateY(30px);

    text-align: center;

    opacity: 0;

    z-index: 20;

    white-space: nowrap;

    transition:
        opacity 2s ease,
        transform 2s ease;
}


/* Saat muncul */

.love-message.show {
    opacity: 1;

    transform:
        translateX(-50%)
        translateY(0);
}


.love-message h1 {
    font-family: Georgia, serif;

    font-size: clamp(32px, 8vw, 58px);

    font-style: italic;

    letter-spacing: 3px;

    color: #ff6689;

    text-shadow:
        0 0 5px #ff6689,
        0 0 15px #ff3366,
        0 0 35px #ff174d;

    animation:
        loveGlow 2s ease-in-out infinite alternate;
}


.love-message span {
    display: inline-block;

    animation:
        heartBeat 1.2s infinite;
}


@keyframes loveGlow {

    from {
        text-shadow:
            0 0 5px #ff6689,
            0 0 15px #ff3366;
    }

    to {
        text-shadow:
            0 0 10px #ff6689,
            0 0 30px #ff3366,
            0 0 50px #ff174d;
    }
}


@keyframes heartBeat {

    0%, 100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.3);
    }
}


/* =========================================
   🌹 KELopak JATUH
========================================= */

.falling-petals {
    position: fixed;

    inset: 0;

    pointer-events: none;

    overflow: hidden;

    z-index: 30;
}


.falling-petal {
    position: absolute;

    top: -50px;

    width: 13px;
    height: 20px;

    background:
        linear-gradient(
            135deg,
            #ff7694,
            #e91e50 55%,
            #8e092e
        );

    border-radius:
        70% 30% 70% 30%;

    opacity: .9;

    filter:
        drop-shadow(
            0 0 4px rgba(255,70,110,.7)
        );

    animation:
        fall linear forwards;
}


/* Gerakan jatuh */

@keyframes fall {

    0% {
        transform:
            translateY(-50px)
            translateX(0)
            rotate(0deg);

        opacity: 0;
    }

    10% {
        opacity: .9;
    }

    25% {
        transform:
            translateY(25vh)
            translateX(35px)
            rotate(100deg);
    }

    50% {
        transform:
            translateY(50vh)
            translateX(-40px)
            rotate(200deg);
    }

    75% {
        transform:
            translateY(75vh)
            translateX(45px)
            rotate(290deg);
    }

    100% {
        transform:
            translateY(110vh)
            translateX(-30px)
            rotate(380deg);

        opacity: 0;
    }
}


/* =========================================
   RESPONSIVE HP
========================================= */

@media (max-width: 500px) {

    .bear {
        width: 150px;
        height: 150px;
    }

    .question {
        font-size: 18px;
    }

    .dome {
        transform: scale(.85);
        margin-top: -80px;
    }

    .love-message {
        bottom: 8%;
    }

    .love-message h1 {
        font-size: 34px;
    }
}

</style>
</head>


<body>


<!-- =========================================
     HALAMAN PERTAMA
========================================= -->

<section id="page1">

    <div class="card">

        <img
            class="bear"
            src="WhatsApp Image 2026-09-07 at 02.29.49.jpeg"
            alt=""
        >

        <div class="question">
            Flowers For You?
        </div>

        <div class="buttons">

            <button id="yes">
                Yes
            </button>

            <button id="no">
                No
            </button>

        </div>

    </div>

</section>



<!-- =========================================
     HALAMAN KEDUA
========================================= -->

<section id="page2">


    <!-- 🌹 WADAH KELopak JATUH -->

    <div
        class="falling-petals"
        id="fallingPetals">
    </div>


    <div class="dome">


        <!-- SPARKLE -->

        <div class="sparkles">

            <span
                class="sparkle"
                style="left:20%;top:35%;animation-delay:.2s">
            </span>

            <span
                class="sparkle"
                style="left:75%;top:30%;animation-delay:.7s">
            </span>

            <span
                class="sparkle"
                style="left:65%;top:55%;animation-delay:1.1s">
            </span>

            <span
                class="sparkle"
                style="left:25%;top:65%;animation-delay:1.5s">
            </span>

            <span
                class="sparkle"
                style="left:80%;top:70%;animation-delay:.4s">
            </span>

            <span
                class="sparkle"
                style="left:45%;top:20%;animation-delay:.9s">
            </span>

            <span
                class="sparkle"
                style="left:35%;top:50%;animation-delay:1.8s">
            </span>

        </div>


        <!-- BUNGA -->

        <div class="rose">

            <div class="flower">

                <div class="petal p1"></div>
                <div class="petal p2"></div>
                <div class="petal p3"></div>
                <div class="petal p4"></div>
                <div class="petal p5"></div>

            </div>

            <div class="stem"></div>

            <div class="leaf left"></div>
            <div class="leaf right"></div>

        </div>


        <!-- KACA -->

        <div class="glass"></div>


        <!-- DASAR -->

        <div class="base"></div>

    </div>


    <!-- ❤️ I LOVE YOU -->

    <div
        class="love-message"
        id="loveMessage">

        <h1>
            I Love You
            <span>❤️</span>
        </h1>

    </div>


</section>



<script>

/* =========================================
   ELEMENT
========================================= */

const page1 =
    document.getElementById("page1");

const page2 =
    document.getElementById("page2");

const yes =
    document.getElementById("yes");

const no =
    document.getElementById("no");

const loveMessage =
    document.getElementById("loveMessage");

const fallingPetals =
    document.getElementById("fallingPetals");


/* =========================================
   TOMBOL YES
========================================= */

yes.addEventListener(
    "click",
    function() {

        /* Hilangkan halaman pertama */

        page1.style.opacity = "0";

        page1.style.transform =
            "scale(1.1)";


        setTimeout(
            function() {

                page1.style.display =
                    "none";


                /* Tampilkan halaman bunga */

                page2.style.pointerEvents =
                    "auto";

                page2.style.opacity =
                    "1";


                /*
                    Setelah bunga muncul,
                    munculkan tulisan
                */

                setTimeout(
                    function() {

                        loveMessage.classList.add(
                            "show"
                        );

                        startFallingPetals();

                    },
                    1200
                );

            },
            1000
        );

    }
);


/* =========================================
   TOMBOL NO BERPINDAH
========================================= */

function moveNoButton() {

    const maxX = 120;

    const maxY = 70;

    const x =
        (Math.random() * maxX * 2)
        - maxX;

    const y =
        (Math.random() * maxY * 2)
        - maxY;

    no.style.position =
        "absolute";

    no.style.transform =
        `translate(${x}px, ${y}px)`;
}


no.addEventListener(
    "mouseenter",
    moveNoButton
);


no.addEventListener(
    "touchstart",
    function(e) {

        e.preventDefault();

        moveNoButton();

    }
);


no.addEventListener(
    "click",
    function() {

        moveNoButton();

    }
);


/* =========================================
   🌹 MEMBUAT KELOPAK JATUH
========================================= */

function createPetal() {

    const petal =
        document.createElement("div");

    petal.classList.add(
        "falling-petal"
    );


    /* Posisi horizontal random */

    petal.style.left =
        Math.random() * 100 + "vw";


    /* Ukuran random */

    const size =
        Math.random() * 8 + 9;

    petal.style.width =
        size + "px";

    petal.style.height =
        size * 1.45 + "px";


    /* Durasi random */

    const duration =
        Math.random() * 4 + 5;

    petal.style.animationDuration =
        duration + "s";


    /* Delay random */

    petal.style.animationDelay =
        Math.random() * 2 + "s";


    /* Rotasi awal random */

    petal.style.transform =
        `rotate(${Math.random() * 360}deg)`;


    fallingPetals.appendChild(
        petal
    );


    /*
        Hapus element setelah
        animasi selesai supaya
        website tidak berat.
    */

    setTimeout(
        function() {

            petal.remove();

        },
        (duration + 2) * 1000
    );

}


/* =========================================
   🌹 MULAI HUJAN KELOPAK
========================================= */

function startFallingPetals() {

    /*
        Buat beberapa kelopak
        langsung ketika halaman
        bunga muncul.
    */

    for(let i = 0; i < 18; i++) {

        setTimeout(
            createPetal,
            i * 150
        );

    }


    /*
        Kemudian terus membuat
        kelopak baru.
    */

    setInterval(
        createPetal,
        450
    );

}

</script>

</body>
</html>
